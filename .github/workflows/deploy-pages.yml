name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [release-published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh latest release manifest (stable only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Emperor-of-Modkind/emperor-mod-manager/releases/latest \
            -o /tmp/latest-release-raw.json; then
            node scripts/build-release-manifest.mjs \
              --input /tmp/latest-release-raw.json \
              --output data/latest-release.json
          else
            echo "::warning::Failed to fetch latest release from GitHub API; keeping committed data/latest-release.json."
          fi

      - name: Refresh patch notes manifest (stable only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! node scripts/build-patch-notes.mjs --output data/patch-notes.json; then
            echo "::warning::Failed to refresh patch notes from GitHub API; keeping committed data/patch-notes.json."
          fi

      - name: Assemble static site artifact
        run: |
          mkdir -p _site
          cp index.html downloads.html wiki.html patch-notes.html _site/
          cp -r assets css js data _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
